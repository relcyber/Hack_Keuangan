<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Keuangan</title>
<link rel="stylesheet" href="css/style.css"></head><body>
  <main>
    <nav id="nav"></nav>
    <h1>💰 Dashboard Keuangan <small id="per" style="color:var(--mu);font-weight:400"></small></h1>
    
<section id="p-dash">
  <div class="grid card" id="stats"></div>
  <div class="card"><h2>Alokasi per Kategori</h2><div id="cats"></div></div>
</section>

<section id="p-out" class="hide">
  <div class="card"><h2>Tambah Pengeluaran</h2>
    <form id="f">
      <div><label>Tanggal</label><input type="date" id="d" required></div>
      <div><label>Deskripsi</label><input id="ds" required></div>
      <div><label>Kategori</label><select id="k"></select></div>
      <div><label>Nominal (Rp)</label><input type="number" id="n" min="1" required></div>
      <div><label>Metode</label><input id="m" placeholder="Qris / Tunai"></div>
      <div><label>Catatan</label><input id="c"></div>
      <button class="btn">Tambah</button>
    </form></div>
  <div class="card wrap"><table><thead><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Nominal</th><th>Metode</th><th>Catatan</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</section>

<section id="p-alo" class="hide">
  <div class="card wrap"><h2>Alokasi (ubah persentase)</h2>
    <table><thead><tr><th>Kategori</th><th>Persentase</th><th>Rencana</th></tr></thead><tbody id="al"></tbody><tfoot id="alf"></tfoot></table></div>
</section>

<section id="p-set" class="hide">
  <div class="card"><h2>Pengaturan</h2>
    <div class="grid"><div><label>Frekuensi pemasukan</label><select id="frq"><option value="1">1 kali sebulan</option><option value="2">2 kali sebulan</option></select></div>
    <div><label>Periode</label><input id="prd"></div></div>
    <h2 style="margin-top:16px">Pemasukan bulanan</h2><div class="grid" id="pay"></div><p id="paytot" style="font-weight:600"></p><p><button class="btn" id="reset" style="background:var(--bad)">Reset ke data awal</button></p></div>
</section>
</main>
<script src="js/app.js"></script></body></html>
